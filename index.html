<!DOCTYPE html>

<html>
<head>
    <title> Find My Free-time</title>
</head>
<body>
    <h1>Add Event</h1>
    <p>Add Your Schedule Below</p>
    <form>
    <div>
        <label for="Ename">Event Name:</label>
        <input type="text" id="Ename" name="Ename" placeholder="Name of event">
    </div>
    <br>
    <div>
        <label for="Day">Day:</label>
        <select id="Day" name="Day">
            <option>Sunday</Option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
        </select>
    </div>
    <br>
    <div>
        <label for="sr_time"> Start Time:</label>
        <input type="time" id="sr_time" name="sr_time">

        <label for="sp_time"> End Time:</label>
        <input type="time" id="sp_time" name="sp_time">
    </div>
    <br>
    <div>
        <button>Add Event</button>
    </div>
    </form>
</body>
</html>
